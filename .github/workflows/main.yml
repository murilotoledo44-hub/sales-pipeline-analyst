name: Weekly Pipeline Report

on:
  schedule:
    # Toda segunda-feira às 08:00 UTC
    - cron: "0 8 * * 1"
  workflow_dispatch: {}  # permite rodar manualmente pela aba Actions

jobs:
  generate-report:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Run tests
        run: pytest -q

      - name: Export deals from HubSpot
        env:
          HUBSPOT_ACCESS_TOKEN: ${{ secrets.HUBSPOT_ACCESS_TOKEN }}
        run: |
          if [ -n "$HUBSPOT_ACCESS_TOKEN" ]; then
            python src/hubspot_source.py --out data/hubspot_pipeline.csv
            echo "PIPELINE_DATA=data/hubspot_pipeline.csv" >> "$GITHUB_ENV"
          else
            echo "HUBSPOT_ACCESS_TOKEN não configurado — usando dados de exemplo."
            echo "PIPELINE_DATA=data/sample_pipeline.csv" >> "$GITHUB_ENV"
          fi

      - name: Generate report
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
        run: >
          python src/generate_report.py
          --data "$PIPELINE_DATA"
          --quota "${{ vars.PIPELINE_QUOTA || '250000' }}"
          --single-thread-min "${{ vars.SINGLE_THREAD_MIN || '25000' }}"

      - name: Commit generated report
        run: |
          git config user.name "pipeline-analyst-bot"
          git config user.email "actions@github.com"
          git add reports/
          git diff --cached --quiet || git commit -m "Relatório automático de pipeline ($(date +'%Y-%m-%d'))"
          git push
